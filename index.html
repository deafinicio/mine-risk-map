<style>
  :root{
    --bg:            #030a10;
    --bg-deep:       #010509;
    --panel:         rgba(5, 18, 26, .90);
    --panel-soft:    rgba(5, 18, 26, .72);
    --line:          rgba(51, 226, 255, .16);
    --grid:          rgba(51, 226, 255, .05);
    --cyan:          #35e6ff;
    --cyan-dim:      #1c7f96;
    --cyan-soft:     rgba(53, 230, 255, .12);
    --green:         #4dffb0;
    --amber:         #ffcc4d;
    --red:           #ff5b5b;
    --text:          #d6f6ff;
    --text-dim:      #6f95a3;
    --font-display:  'Orbitron', sans-serif;
    --font-mono:     'Share Tech Mono', monospace;
  }

  *{ box-sizing:border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: var(--font-mono);
    color: var(--text);
  }

  #map {
    position: absolute;
    inset: 0;
    top: 52px;
    height: calc(100% - 52px);
    background: var(--bg-deep);
  }

  /* ---------- ambient HUD chrome ---------- */

  #hud-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 46px 46px;
  }

  #hud-scan{
    position:fixed; inset:0; z-index:1000; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  #hud-vignette{
    position:fixed; inset:0; z-index:999; pointer-events:none;
    box-shadow: inset 0 0 160px rgba(0,0,0,.75);
  }

  /* ---------- top bar ---------- */

  #top-bar{
    position:relative; z-index:600;
    height:52px;
    display:flex;
    align-items:center;
    gap:22px;
    padding:0 16px;
    background: linear-gradient(180deg, #06131a 0%, #030a10 100%);
    border-bottom:1px solid var(--line);
    box-shadow: 0 1px 18px rgba(53,230,255,.10);
    font-family: var(--font-mono);
    white-space:nowrap;
    overflow:hidden;
  }

  #top-bar .brand{
    font-family: var(--font-display);
    font-weight:900;
    letter-spacing:2px;
    font-size:15px;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(53,230,255,.65);
    display:flex;
    align-items:center;
    gap:8px;
  }

  #top-bar .brand::before{
    content:"";
    width:9px; height:9px;
    background: var(--green);
    border-radius:50%;
    box-shadow:0 0 8px var(--green);
    animation: blink 1.6s infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:.25; }
  }

  .hud-stat{
    display:flex;
    flex-direction:column;
    line-height:1.15;
    font-size:11px;
  }
  .hud-stat b{
    font-size:12.5px;
    color:var(--text);
    letter-spacing:.5px;
  }
  .hud-stat span{
    color:var(--text-dim);
    font-size:9.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }

  .hud-sep{
    width:1px; height:26px;
    background:var(--line);
    flex:none;
  }

  #top-bar .spacer{ flex:1; }

  #top-bar .status-tag{
    font-size:9.5px;
    letter-spacing:2px;
    color: var(--green);
    border:1px solid rgba(77,255,176,.4);
    padding:3px 8px;
    text-transform:uppercase;
    background: rgba(77,255,176,.06);
  }

  /* ---------- panels (angular HUD frame) ---------- */

  .control-box, .icon-control{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    box-shadow: 0 0 0 1px rgba(53,230,255,.05), 0 8px 24px rgba(0,0,0,.55), 0 0 18px rgba(53,230,255,.08);
    position: relative;
  }

  .control-box::before, .icon-control::before{
    content:"";
    position:absolute; left:0; right:0; top:0;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.7;
  }

  .control-box{
    padding: 12px 14px 10px;
  }

  .control-box .section-title{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cyan);
    margin: 0 0 10px;
    padding-bottom:6px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .control-box .section-title::before{
    content:"//";
    color: var(--text-dim);
  }

  .control-box input,
  .control-box select,
  .control-box button,
  .control-box label {
    display: block;
    width: 100%;
    margin-bottom: 8px;
    box-sizing: border-box;
    font-family: var(--font-mono);
  }

  .control-box label{
    font-size:9.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-bottom:4px;
  }

  .control-box input,
  .control-box select,
  .control-box button {
    padding: 7px 8px;
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
    background: rgba(0,10,16,.55);
    color: var(--text);
    font-size:12.5px;
  }

  .control-box select{
    appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  .control-box input::placeholder{ color: var(--text-dim); }

  .control-box input:focus,
  .control-box select:focus{
    outline:none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 10px rgba(53,230,255,.45);
  }

  .control-box button{
    cursor:pointer;
    color: var(--cyan);
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:10.5px;
    font-weight:700;
    border-color: var(--cyan-dim);
    transition: all .15s ease;
  }
  .control-box button:hover{
    background: var(--cyan-soft);
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(53,230,255,.35);
  }
  .control-box button:active{ transform: translateY(1px); }

  #filter-btn{ color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
  #filter-btn:hover{ background: #7cf1ff; }

  .control-box input[type="range"] {
    padding: 0;
    border: 0;
    margin-bottom: 12px;
    -webkit-appearance:none;
    height:4px;
    background: linear-gradient(90deg, var(--cyan-dim), var(--line));
    border-radius:2px;
  }
  .control-box input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background: var(--cyan);
    box-shadow: 0 0 8px rgba(53,230,255,.9);
    cursor:pointer;
    margin-top:-4.5px;
  }

  .control-box .small-label{
    font-size: 10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
    display:flex;
    justify-content:space-between;
  }
  .control-box .small-label span{ color: var(--cyan); }

  .icon-control {
    overflow: hidden;
    display:flex;
    flex-direction:column;
  }

  .icon-control button {
    width: 46px;
    height: 38px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
    font-size: 9.5px;
    letter-spacing:1px;
    font-weight:700;
    color: var(--cyan);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
  }
  .icon-control button:last-child{ border-bottom:0; }

  .icon-control button:hover {
    background: var(--cyan-soft);
    box-shadow: inset 0 0 12px rgba(53,230,255,.35);
  }

  .filter-panel-hidden {
    display: none;
  }

  .export-status {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing:.5px;
    color: var(--green);
    min-height: 12px;
  }

  /* ---------- coordinate readout ---------- */

  #coord-readout{
    position:absolute;
    left:14px; bottom:14px;
    z-index:500;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--cyan);
    background: var(--panel-soft);
    border:1px solid var(--line);
    padding:6px 10px;
    letter-spacing:1px;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    pointer-events:none;
  }
  #coord-readout .lbl{ color: var(--text-dim); margin-right:6px; }

  /* ---------- radar decoration ---------- */

  #radar{
    position:absolute;
    right:14px; bottom:14px;
    z-index:500;
    width:74px; height:74px;
    border-radius:50%;
    border:1px solid var(--line);
    background: radial-gradient(circle, rgba(53,230,255,.06) 0%, rgba(0,0,0,.4) 100%);
    pointer-events:none;
    overflow:hidden;
  }
  #radar::before{
    content:"";
    position:absolute; inset:0;
    background: conic-gradient(from 0deg, rgba(53,230,255,.55), transparent 28%, transparent 100%);
    animation: sweep 3.2s linear infinite;
  }
  #radar::after{
    content:"";
    position:absolute; inset:8px;
    border-radius:50%;
    border:1px solid rgba(53,230,255,.18);
  }
  @keyframes sweep{ to{ transform: rotate(360deg); } }
  #radar span{
    position:absolute; bottom:3px; left:0; right:0;
    text-align:center;
    font-size:7.5px;
    letter-spacing:1.5px;
    color: var(--text-dim);
  }

  /* ---------- leaflet overrides ---------- */

  .leaflet-container{
    background: var(--bg-deep);
    font-family: var(--font-mono);
  }

  .leaflet-control-zoom a{
    background: var(--panel) !important;
    color: var(--cyan) !important;
    border: 1px solid var(--line) !important;
  }
  .leaflet-control-zoom a:hover{
    background: var(--cyan-soft) !important;
  }

  .leaflet-control-layers{
    background: var(--panel) !important;
    color: var(--text) !important;
    border: 1px solid var(--line) !important;
    font-family: var(--font-mono);
    font-size: 12px;
    box-shadow: 0 0 18px rgba(53,230,255,.08);
  }
  .leaflet-control-layers-separator{ border-color: var(--line) !important; }

  .leaflet-popup-content-wrapper{
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: var(--font-mono);
    box-shadow: 0 0 20px rgba(53,230,255,.18);
  }
  .leaflet-popup-content{ font-size:12.5px; line-height:1.5; }
  .leaflet-popup-content b{ color: var(--cyan); }
  .leaflet-popup-tip{ background: var(--panel); border:1px solid var(--line); }
  .leaflet-popup-close-button{ color: var(--cyan) !important; }

  .leaflet-bar{ border: none !important; }

  .leaflet-control-attribution{
    background: rgba(3,10,16,.7) !important;
    color: var(--text-dim) !important;
    font-family: var(--font-mono);
    font-size:10px;
  }
  .leaflet-control-attribution a{ color: var(--cyan-dim) !important; }

  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large{
    background: rgba(53,230,255,.15) !important;
  }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div{
    background: rgba(3,15,20,.85) !important;
    color: var(--cyan) !important;
    border: 1px solid var(--cyan) !important;
    box-shadow: 0 0 10px rgba(53,230,255,.5);
    font-family: var(--font-mono);
    font-weight:700;
  }

  .hud-marker{
    width:14px; height:14px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(53,230,255,.9) 0%, rgba(53,230,255,.15) 70%);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 8px rgba(53,230,255,.9);
    position:relative;
  }
  .hud-marker::after{
    content:"";
    position:absolute; inset:-6px;
    border-radius:50%;
    border:1px solid rgba(53,230,255,.35);
    animation: pulse-ring 2.2s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(.4); opacity:.9; }
    100%{ transform:scale(1.8); opacity:0; }
  }
</style>

<body>

<div id="hud-bg"></div>

<div id="top-bar">
  <div class="brand">MINE RISK // TRACK SYS</div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-clock">--:--:--</b><span>local time</span></div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-date">----</b><span>date</span></div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-total">0</b><span>sessions total</span></div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-shown">0</b><span>shown on map</span></div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-participants">0</b><span>participants</span></div>
  <div class="spacer"></div>
  <div class="status-tag" id="hud-live">● LIVE FEED</div>
</div>

<div id="map"></div>

<div id="coord-readout"><span class="lbl">LAT</span><span id="coord-lat">—</span> &nbsp; <span class="lbl">LON</span><span id="coord-lon">—</span></div>

<div id="radar"><span>SCAN</span></div>

<div id="hud-scan"></div>
<div id="hud-vignette"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
// ===== CONFIG =====
const APPS_SCRIPT_DATA_URL =
  "https://script.google.com/macros/s/AKfycbyiDID7u07n2C8rDc_DIfYYVn6OS-0FaAoLCpNl3jDyi7A2bpZiKJfj62TiwYLvjsWFvw/exec";

const SETTLEMENTS_GEOJSON_URL = "data/kharkiv_settlements_points.geojson";

// ===== HELPERS =====
function normalizeText(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[`ʼ']/g, "’")
    .replace(/\s+/g, " ");
}

function makeKey(raion, hromada, settlement) {
  return [
    normalizeText(raion),
    normalizeText(hromada),
    normalizeText(settlement)
  ].join("||");
}

function safeNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function parseDate(value) {
  if (!value) return null;
  const d = new Date(value);
  return isNaN(d.getTime()) ? null : d;
}

function hslToHex(h, s, l) {
  s /= 100;
  l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n =>
    l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x =>
    Math.round(255 * x).toString(16).padStart(2, "0");
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

function getHeatGradient() {
  const purple = heatSettings.purpleStrength;
  const purple1 = hslToHex(268, 100, Math.max(28, 58 - purple * 0.20));
  const purple2 = hslToHex(252, 100, Math.max(34, 62 - purple * 0.14));

  return {
    0.03: purple1,
    0.12: purple2,
    0.28: "#4b5dff",
    0.48: "#35c6ff",
    0.68: "#51ff7a",
    0.84: "#ffe14a",
    1.00: "#ff3b30"
  };
}

function downloadBlob(blob, filename) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);
}

// ===== HUD CHROME (clock / coords / stats) =====
function tickClock() {
  const now = new Date();
  const clockEl = document.getElementById("hud-clock");
  const dateEl = document.getElementById("hud-date");
  if (clockEl) clockEl.textContent = now.toLocaleTimeString("uk-UA", { hour12: false });
  if (dateEl) dateEl.textContent = now.toLocaleDateString("uk-UA");
}
tickClock();
setInterval(tickClock, 1000);

function updateHudStats() {
  const totalEl = document.getElementById("hud-total");
  const shownEl = document.getElementById("hud-shown");
  const participantsEl = document.getElementById("hud-participants");

  if (totalEl) totalEl.textContent = allSessions.length;
  if (shownEl) shownEl.textContent = currentFeatures.length;

  if (participantsEl) {
    const sum = currentFeatures.reduce(function(acc, f) {
      return acc + safeNumber((f.properties || {}).participants_total);
    }, 0);
    participantsEl.textContent = sum;
  }
}

// ===== MAP =====
var map = L.map("map", { zoomControl: true }).setView([49.9935, 36.2304], 8);
var kharkivBounds = L.latLngBounds([[48.5, 34.8], [50.6, 38.3]]);
map.fitBounds(kharkivBounds);

map.on("mousemove", function(e) {
  var latEl = document.getElementById("coord-lat");
  var lonEl = document.getElementById("coord-lon");
  if (latEl) latEl.textContent = e.latlng.lat.toFixed(4);
  if (lonEl) lonEl.textContent = e.latlng.lng.toFixed(4);
});

// ===== BASEMAPS =====
var dark = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  { maxZoom: 20, crossOrigin: true, attribution: "&copy; OpenStreetMap &copy; CARTO" }
);

var carto = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  { maxZoom: 20, crossOrigin: true, attribution: "&copy; OpenStreetMap &copy; CARTO" }
);

var osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, crossOrigin: true, attribution: "&copy; OpenStreetMap" }
);

dark.addTo(map);

function fallback(fromLayer, toLayer) {
  function once() {
    fromLayer.off("tileerror", once);
    if (map.hasLayer(fromLayer)) {
      map.removeLayer(fromLayer);
    }
    toLayer.addTo(map);
  }
  fromLayer.on("tileerror", once);
}

fallback(dark, carto);
fallback(carto, osm);

var baseLayers = {
  "Dark Ops (за замовч.)": dark,
  "Carto Voyager": carto,
  "OpenStreetMap": osm
};

// ===== LIVE DATA =====
var clusterLayer = L.markerClusterGroup();
var heatLayer = null;
var heatProxy = L.layerGroup();

var allSessions = [];
var currentFeatures = [];
var settlementsLookup = new Map();

const heatSettings = {
  radius: 40,
  blur: 36,
  maxZoom: 12,
  minOpacity: 0.30,
  exponent: 0.42,
  minFloor: 0.10,
  purpleStrength: 78
};

function buildSettlementsLookup(settlementsGeo) {
  settlementsLookup.clear();

  (settlementsGeo.features || []).forEach(function(f) {
    const p = f.properties || {};
    const geom = f.geometry || {};
    const coords = geom.coordinates;

    if (!coords || geom.type !== "Point") return;

    const key = makeKey(p.raion, p.hromada, p.settlement);

    settlementsLookup.set(key, {
      lat: coords[1],
      lon: coords[0],
      properties: p
    });
  });
}

function convertRowsToFeatures(rows) {
  const features = [];

  rows.forEach(function(row) {
    const key = makeKey(row.raion, row.hromada, row.settlement);
    const settlementPoint = settlementsLookup.get(key);

    if (!settlementPoint) {
      console.warn("Не знайдено населений пункт у довіднику:", row);
      return;
    }

    const participantsTotal = safeNumber(row.participants_total);
    const participantsU18 = safeNumber(row.participants_u18);
    const participants18Plus = safeNumber(row.participants_18plus);

    features.push({
      type: "Feature",
      geometry: {
        type: "Point",
        coordinates: [settlementPoint.lon, settlementPoint.lat]
      },
      properties: {
        created_at: row.created_at || "",
        session_date: row.session_date || "",
        raion: row.raion || "",
        hromada: row.hromada || "",
        settlement: row.settlement || "",
        instructor_1: row.instructor_1 || "",
        instructor_2: row.instructor_2 || "",
        participants_total: participantsTotal,
        participants_u18: participantsU18,
        participants_18plus: participants18Plus,
        notes: row.notes || ""
      }
    });
  });

  return features;
}

function hudDivIcon() {
  return L.divIcon({
    className: "",
    html: '<div class="hud-marker"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    popupAnchor: [0, -8]
  });
}

function buildLayers(features) {
  currentFeatures = features;
  clusterLayer.clearLayers();

  if (heatLayer) {
    heatLayer.setLatLngs([]);
  }

  var geo = {
    type: "FeatureCollection",
    features: features
  };

  var markers = L.geoJSON(geo, {
    pointToLayer: function(f, latlng) {
      return L.marker(latlng, { icon: hudDivIcon() });
    },
    onEachFeature: function(f, layer) {
      var p = f.properties || {};

      var instructors = [p.instructor_1, p.instructor_2]
        .filter(Boolean)
        .join(", ");

      var html =
        "<b>" + (p.settlement || "Населений пункт") + "</b><br>" +
        (p.hromada || "—") + (p.raion ? ", " + p.raion : "") + "<br>" +
        "Дата: " + (p.session_date || "—") + "<br>" +
        "Інструктори: " + (instructors || "—") + "<br>" +
        "Усього учасників: " + (p.participants_total ?? "—") + "<br>" +
        "До 18: " + (p.participants_u18 ?? "—") + "<br>" +
        "18+: " + (p.participants_18plus ?? "—") +
        (p.notes ? "<br>Примітки: " + p.notes : "");

      layer.bindPopup(html);
    }
  });

  clusterLayer.addLayer(markers);

  if (typeof L.heatLayer !== "undefined") {
    var maxParticipants = 0;

    features.forEach(function(f) {
      var p = f.properties || {};
      var val = safeNumber(p.participants_total);
      if (val > maxParticipants) maxParticipants = val;
    });

    if (maxParticipants <= 0) {
      maxParticipants = 1;
    }

    var heatData = features.map(function(f) {
      var c = f.geometry && f.geometry.coordinates;
      var p = f.properties || {};

      if (!c) return null;

      var participants = safeNumber(p.participants_total);

      var intensity = Math.pow(
        participants / maxParticipants,
        heatSettings.exponent
      );

      intensity = intensity * heatSettings.purpleStrength / 78;
      intensity = Math.max(
        heatSettings.minFloor,
        Math.min(1, intensity)
      );

      return [c[1], c[0], intensity];
    }).filter(Boolean);

    if (!heatLayer) {
      heatLayer = L.heatLayer(heatData, {
        radius: heatSettings.radius,
        blur: heatSettings.blur,
        maxZoom: heatSettings.maxZoom,
        minOpacity: heatSettings.minOpacity,
        gradient: getHeatGradient()
      });
    } else {
      heatLayer.setLatLngs(heatData);
    }

    if (map.hasLayer(heatProxy)) {
      if (!map.hasLayer(heatLayer)) {
        heatLayer.addTo(map);
      }
    }
  }

  updateHudStats();
}

function populateFilterOptions(features) {
  const instructorSelect = document.getElementById("instructor-filter");
  const raionSelect = document.getElementById("raion-filter");
  const hromadaSelect = document.getElementById("hromada-filter");
  const settlementSelect = document.getElementById("settlement-filter");

  const instructors = new Set();
  const raions = new Set();
  const hromadas = new Set();
  const settlements = new Set();

  features.forEach(function(f) {
    const p = f.properties || {};
    if (p.instructor_1) instructors.add(p.instructor_1);
    if (p.instructor_2) instructors.add(p.instructor_2);
    if (p.raion) raions.add(p.raion);
    if (p.hromada) hromadas.add(p.hromada);
    if (p.settlement) settlements.add(p.settlement);
  });

  function fillSelect(select, values, defaultText) {
    select.innerHTML = "";

    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = defaultText;
    select.appendChild(defaultOption);

    [...values]
      .sort((a, b) => a.localeCompare(b, "uk"))
      .forEach(function(value) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
  }

  fillSelect(instructorSelect, instructors, "Усі інструктори");
  fillSelect(raionSelect, raions, "Усі райони");
  fillSelect(hromadaSelect, hromadas, "Усі громади");
  fillSelect(settlementSelect, settlements, "Усі населені пункти");
}

function repopulateSettlementOptions(selectedRaion, selectedHromada) {
  const settlementSelect = document.getElementById("settlement-filter");
  if (!settlementSelect) return;

  const settlements = new Set();
  allSessions.forEach(function(f) {
    const p = f.properties || {};
    const okRaion = !selectedRaion || p.raion === selectedRaion;
    const okHromada = !selectedHromada || p.hromada === selectedHromada;
    if (okRaion && okHromada && p.settlement) settlements.add(p.settlement);
  });

  settlementSelect.innerHTML = '<option value="">Усі населені пункти</option>';
  [...settlements]
    .sort((a, b) => a.localeCompare(b, "uk"))
    .forEach(function(value) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      settlementSelect.appendChild(option);
    });
}

function applyFilters() {
  var txt = (document.getElementById("search-input").value || "").trim().toLowerCase();
  var sVal = document.getElementById("start-date").value;
  var eVal = document.getElementById("end-date").value;
  var selectedInstructor = document.getElementById("instructor-filter").value;
  var selectedRaion = document.getElementById("raion-filter").value;
  var selectedHromada = document.getElementById("hromada-filter").value;
  var selectedSettlement = document.getElementById("settlement-filter").value;

  var sDate = sVal ? new Date(sVal + "T00:00:00") : null;
  var eDate = eVal ? new Date(eVal + "T23:59:59.999") : null;

  var filtered = allSessions.filter(function(f) {
    var p = f.properties || {};

    var matchSearch =
      !txt ||
      (p.hromada && p.hromada.toLowerCase().includes(txt)) ||
      (p.raion && p.raion.toLowerCase().includes(txt)) ||
      (p.settlement && p.settlement.toLowerCase().includes(txt));

    var d = parseDate(p.session_date);
    var okS = !sDate || (d && d >= sDate);
    var okE = !eDate || (d && d <= eDate);

    var matchInstructor =
      !selectedInstructor ||
      p.instructor_1 === selectedInstructor ||
      p.instructor_2 === selectedInstructor;

    var matchRaion = !selectedRaion || p.raion === selectedRaion;
    var matchHromada = !selectedHromada || p.hromada === selectedHromada;
    var matchSettlement = !selectedSettlement || p.settlement === selectedSettlement;

    return matchSearch && okS && okE && matchInstructor && matchRaion && matchHromada && matchSettlement;
  });

  buildLayers(filtered);
}

async function loadLiveSessions() {
  var liveTag = document.getElementById("hud-live");
  try {
    if (liveTag) { liveTag.textContent = "● SYNCING"; liveTag.style.color = "var(--amber)"; }

    const [settlementsResponse, sessionsResponse] = await Promise.all([
      fetch(SETTLEMENTS_GEOJSON_URL + "?nocache=" + Date.now()),
      fetch(APPS_SCRIPT_DATA_URL + "?nocache=" + Date.now())
    ]);

    if (!settlementsResponse.ok) {
      throw new Error("Не вдалося завантажити довідник населених пунктів");
    }

    if (!sessionsResponse.ok) {
      throw new Error("Не вдалося завантажити живі дані з Google Sheets");
    }

    const settlementsGeo = await settlementsResponse.json();
    const rows = await sessionsResponse.json();

    buildSettlementsLookup(settlementsGeo);
    allSessions = convertRowsToFeatures(Array.isArray(rows) ? rows : []);
    buildLayers(allSessions);
    populateFilterOptions(allSessions);

    if (liveTag) { liveTag.textContent = "● LIVE FEED"; liveTag.style.color = ""; }
  } catch (error) {
    console.error(error);
    if (liveTag) { liveTag.textContent = "● FEED ERROR"; liveTag.style.color = "var(--red)"; }
  }
}

  inputs.forEach(function(el) {

function refreshHeatmapSettings() {
  if (currentFeatures.length) {
    if (heatLayer && map.hasLayer(heatLayer)) {
      map.removeLayer(heatLayer);
    }
    heatLayer = null;
    buildLayers(currentFeatures);
  }
}

async function exportMapToPNG() {
  const status = document.getElementById("export-status");
  if (status) status.textContent = "Готую PNG...";

  const heatPanel = document.getElementById("heat-settings-panel");
  const oldDisplay = heatPanel ? heatPanel.style.display : "";

  if (heatPanel) heatPanel.style.display = "none";

  try {
    await new Promise(resolve => setTimeout(resolve, 500));

    const canvas = await html2canvas(document.getElementById("map"), {
      useCORS: true,
      backgroundColor: null,
      logging: false,
      scale: 2
    });

    canvas.toBlob(function(blob) {
      if (!blob) {
        if (status) status.textContent = "Не вдалося створити PNG.";
        return;
      }

      const now = new Date();
      const filename =
        "mine-risk-map-" +
        now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0") + "_" +
        String(now.getHours()).padStart(2, "0") + "-" +
        String(now.getMinutes()).padStart(2, "0") +
        ".png";

      downloadBlob(blob, filename);
      if (status) status.textContent = "PNG експортовано.";
    });
  } catch (error) {
    console.error(error);
    if (status) status.textContent = "Помилка експорту PNG.";
  } finally {
    if (heatPanel) heatPanel.style.display = oldDisplay;
  }
}

setTimeout(function() {
  document.getElementById("toggle-heat-settings").addEventListener("click", function() {
    const panel = document.getElementById("heat-settings-panel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
  });

  document.getElementById("toggle-filters-btn").addEventListener("click", function() {
    const panel = document.getElementById("filters-panel");
    panel.classList.toggle("filter-panel-hidden");
  });

  document.getElementById("export-png-btn").addEventListener("click", function() {
    exportMapToPNG();
  });

  document.getElementById("radius-slider").addEventListener("input", function() {
    heatSettings.radius = Number(this.value);
    document.getElementById("radius-value").textContent = this.value;
    refreshHeatmapSettings();
  });

  document.getElementById("blur-slider").addEventListener("input", function() {
    heatSettings.blur = Number(this.value);
    document.getElementById("blur-value").textContent = this.value;
    refreshHeatmapSettings();
  });

  document.getElementById("opacity-slider").addEventListener("input", function() {
    heatSettings.minOpacity = Number(this.value);
    document.getElementById("opacity-value").textContent = this.value;
    refreshHeatmapSettings();
  });

  document.getElementById("exponent-slider").addEventListener("input", function() {
    heatSettings.exponent = Number(this.value);
    document.getElementById("exponent-value").textContent = this.value;
    refreshHeatmapSettings();
  });

  document.getElementById("floor-slider").addEventListener("input", function() {
    heatSettings.minFloor = Number(this.value);
    document.getElementById("floor-value").textContent = this.value;
    refreshHeatmapSettings();
  });

  document.getElementById("purple-slider").addEventListener("input", function() {
    heatSettings.purpleStrength = Number(this.value);
    document.getElementById("purple-value").textContent = this.value;
    refreshHeatmapSettings();
  });

  document.getElementById("reset-heat-settings").addEventListener("click", function() {
    heatSettings.radius = 40;
    heatSettings.blur = 36;
    heatSettings.minOpacity = 0.30;
    heatSettings.exponent = 0.42;
    heatSettings.minFloor = 0.10;
    heatSettings.purpleStrength = 78;

    document.getElementById("radius-slider").value = heatSettings.radius;
    document.getElementById("blur-slider").value = heatSettings.blur;
    document.getElementById("opacity-slider").value = heatSettings.minOpacity;
    document.getElementById("exponent-slider").value = heatSettings.exponent;
    document.getElementById("floor-slider").value = heatSettings.minFloor;
    document.getElementById("purple-slider").value = heatSettings.purpleStrength;

    document.getElementById("radius-value").textContent = heatSettings.radius;
    document.getElementById("blur-value").textContent = heatSettings.blur;
    document.getElementById("opacity-value").textContent = heatSettings.minOpacity;
    document.getElementById("exponent-value").textContent = heatSettings.exponent;
    document.getElementById("floor-value").textContent = heatSettings.minFloor;
    document.getElementById("purple-value").textContent = heatSettings.purpleStrength;

    refreshHeatmapSettings();
  });

  document.getElementById("filter-btn").addEventListener("click", applyFilters);

  document.getElementById("refresh-btn").addEventListener("click", function() {
    loadLiveSessions();
  });

  document.getElementById("reset-btn").addEventListener("click", function() {
    document.getElementById("search-input").value = "";
    document.getElementById("start-date").value = "";
    document.getElementById("end-date").value = "";
    document.getElementById("instructor-filter").value = "";
    document.getElementById("raion-filter").value = "";
    document.getElementById("hromada-filter").value = "";
    document.getElementById("settlement-filter").value = "";
    repopulateSettlementOptions("", "");
    buildLayers(allSessions);
  });

  document.getElementById("raion-filter").addEventListener("change", function() {
    const selectedRaion = this.value;
    const hromadaSelect = document.getElementById("hromada-filter");

    const hromadas = new Set();
    allSessions.forEach(function(f) {
      const p = f.properties || {};
      if (!selectedRaion || p.raion === selectedRaion) {
        if (p.hromada) hromadas.add(p.hromada);
      }
    });

    hromadaSelect.innerHTML = '<option value="">Усі громади</option>';
    [...hromadas]
      .sort((a, b) => a.localeCompare(b, "uk"))
      .forEach(function(value) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        hromadaSelect.appendChild(option);
      });

    // Район змінився -> громада скинута, тож населені пункти звужуємо лише за районом
    repopulateSettlementOptions(selectedRaion, "");
  });

  document.getElementById("hromada-filter").addEventListener("change", function() {
    const selectedRaion = document.getElementById("raion-filter").value;
    const selectedHromada = this.value;
    repopulateSettlementOptions(selectedRaion, selectedHromada);
  });
}, 0);

  if (heatLayer && map.hasLayer(heatLayer)) {
    map.removeLayer(heatLayer);
  }
});
