<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Activity Form</title>
  <script defer src="script.js"></script>
</head>

<body>

<h2>Додати активність</h2>

<form id="activity-form">

  <!-- НАПРЯМОК -->
  <label>Напрямок:</label>
  <select id="direction">
    <option value="EORE">EORE</option>
    <option value="DIR2">Напрямок 2</option>
    <option value="DIR3">Напрямок 3</option>
    <option value="DIR4">Напрямок 4</option>
    <option value="DIR5">Напрямок 5</option>
  </select>

  <br><br>

  <!-- РАЙОН -->
  <label>Район:</label>
  <select id="district">
    <option>Харківський</option>
    <option>Ізюмський</option>
  </select>

  <br><br>

  <!-- ГРОМАДА -->
  <label>Громада:</label>
  <select id="community">
    <option>Громада 1</option>
    <option>Громада 2</option>
  </select>

  <br><br>

  <!-- НАСЕЛЕНИЙ ПУНКТ -->
  <label>Населений пункт:</label>
  <input type="text" id="settlement">

  <br><br>

  <!-- ІНСТРУКТОР (ТІЛЬКИ EORE) -->
  <div id="instructor-wrapper">
    <label>Інструктор:</label>
    <select id="instructor">
      <option>Інструктор 1</option>
      <option>Інструктор 2</option>
    </select>
  </div>

  <br>

  <!-- КІЛЬКІСТЬ -->
  <label id="beneficiaries-label">Кількість осіб:</label>
  <input type="number" id="beneficiaries">

  <br><br>

  <!-- КОМЕНТАР -->
  <label>Коментар:</label>
  <textarea id="comment"></textarea>

  <br><br>

  <button type="submit">Зберегти</button>

</form>

</body>
</html>
