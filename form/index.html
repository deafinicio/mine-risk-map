<!DOCTYPE html>
<html lang="uk">
<head>
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Форма внесення активностей — Activity Heatmap" />
  <meta property="og:description" content="Форма для внесення даних про активності організації в Харківській області." />
  <meta property="og:url" content="https://deafinicio.github.io/mine-risk-map/form/" />
  <meta property="og:image" content="https://deafinicio.github.io/mine-risk-map/assets/preview-form.jpg" />
  <meta property="og:image:secure_url" content="https://deafinicio.github.io/mine-risk-map/assets/preview-form.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Activity Heatmap" />
  <meta property="og:locale" content="uk_UA" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Форма внесення активностей — Activity Heatmap" />
  <meta name="twitter:description" content="Швидке внесення даних про активності організації." />
  <meta name="twitter:image" content="https://deafinicio.github.io/mine-risk-map/assets/preview-form.jpg" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Форма внесення активностей — Mine Risk Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="hud-bg"></div>
<div id="hud-scan"></div>
<div id="hud-vignette"></div>

<div id="top-bar">
  <div class="brand">MINE RISK // DATA ENTRY</div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-clock">--:--:--</b><span>local time</span></div>
  <div class="hud-sep"></div>
  <div class="hud-stat"><b id="hud-date">----</b><span>date</span></div>
  <div class="spacer"></div>
  <a class="back-link" href="../index.html">← До карти</a>
</div>

<main class="container">
  <div class="panel-topline"></div>
  <h1><span class="eyebrow">// нова активність</span>Форма внесення активностей</h1>
  <p class="subtitle">Заповни дані про проведену активність. Дані йдуть напряму у Google Sheets.</p>

  <form
    id="mre-form"
    action="https://script.google.com/macros/s/AKfycbyiDID7u07n2C8rDc_DIfYYVn6OS-0FaAoLCpNl3jDyi7A2bpZiKJfj62TiwYLvjsWFvw/exec"
    method="POST"
    target="hidden_iframe"
  >
    <input type="hidden" id="direction" name="direction" value="EORE" />

    <div class="field-row">
      <div class="field">
        <label for="raion">Район</label>
        <select id="raion" name="raion" required>
          <option value="">Оберіть район</option>
        </select>
      </div>

      <div class="field">
        <label for="hromada">Громада</label>
        <select id="hromada" name="hromada" required disabled>
          <option value="">Спочатку оберіть район</option>
        </select>
      </div>

      <div class="field">
        <label for="settlement">Населений пункт</label>
        <select id="settlement" name="settlement" required disabled>
          <option value="">Спочатку оберіть громаду</option>
        </select>
      </div>
    </div>

    <div class="field date-field">
      <label for="session_date">Дата проведення активності</label>
      <input type="date" id="session_date" name="session_date" required />
    </div>

    <section id="eore-fields" class="conditional-section">
      <div class="section-title">Учасники сесії</div>

      <div class="field-row">
        <div class="field">
          <label for="instructor_1">Інструктор 1</label>
          <select id="instructor_1" name="instructor_1" required>
            <option value="">Оберіть інструктора</option>
            <option value="Гарбузов В.">Гарбузов В.</option>
            <option value="Карпенко Н.">Карпенко Н.</option>
            <option value="Завадський К.">Завадський К.</option>
            <option value="Сластієнко В.">Сластієнко В.</option>
            <option value="Тікус А.">Тікус А.</option>
            <option value="Маркін А.">Маркін А.</option>
            <option value="Бондар О.">Бондар О.</option>
            <option value="Гаркуша А.">Гаркуша А.</option>
          </select>
        </div>

        <div class="field">
          <label for="instructor_2">Інструктор 2</label>
          <select id="instructor_2" name="instructor_2">
            <option value="">Необов’язково</option>
            <option value="Гарбузов В.">Гарбузов В.</option>
            <option value="Карпенко Н.">Карпенко Н.</option>
            <option value="Завадський К.">Завадський К.</option>
            <option value="Сластієнко В.">Сластієнко В.</option>
            <option value="Тікус А.">Тікус А.</option>
            <option value="Маркін А.">Маркін А.</option>
            <option value="Бондар О.">Бондар О.</option>
            <option value="Гаркуша А.">Гаркуша А.</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="participants_u18">Кількість до 18 років</label>
          <input type="number" id="participants_u18" name="participants_u18" min="0" step="1" placeholder="0" />
        </div>

        <div class="field">
          <label for="participants_18plus">Кількість 18+ років</label>
          <input type="number" id="participants_18plus" name="participants_18plus" min="0" step="1" placeholder="0" />
        </div>
      </div>

      <div class="field">
        <label for="participants_total">Загальна кількість учасників <span class="auto-tag">авто</span></label>
        <input type="number" id="participants_total" name="participants_total" min="0" readonly />
        <p class="field-hint">Обчислюється автоматично як сума полів «До 18» і «18+». Заповни хоча б одне з них.</p>
      </div>
    </section>

    <div class="field">
      <label for="notes">Коментар / примітки</label>
      <textarea id="notes" name="notes" rows="4" placeholder="Необов’язково"></textarea>
    </div>

    <div class="actions">
      <button type="submit">Надіслати дані</button>
    </div>

    <div id="form-status" class="status" aria-live="polite"></div>
  </form>
</main>

<script src="app.js"></script>
<script>
  function tickClock() {
    const now = new Date();
    const clockEl = document.getElementById("hud-clock");
    const dateEl = document.getElementById("hud-date");
    if (clockEl) clockEl.textContent = now.toLocaleTimeString("uk-UA", { hour12: false });
    if (dateEl) dateEl.textContent = now.toLocaleDateString("uk-UA");
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
</body>
</html>
